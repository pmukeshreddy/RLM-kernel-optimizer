# RLM Beam Search Configuration

models:
  planner_model: "claude-sonnet-4-6"      # planner agent
  coder_model: "claude-sonnet-4-6"        # code generation agent
  fixer_model: "claude-sonnet-4-6"        # repair agent for compile/below-baseline failures
  root_model: "claude-sonnet-4-6"         # decomposition
  sub_model: "claude-sonnet-4-6"          # codegen
  combine_model: "claude-sonnet-4-6"      # combination

beam:
  width: 4                    # parallel strategy variants
  refine_rounds: 4            # profiler feedback iterations
  max_sub_calls_per_round: 2  # cap recursive depth
  combine_top_k: 2            # merge top-K into final
  diversity_mode: "bottleneck_cluster"  # cluster-based pruning
  tree_speedup_threshold: 1.0 # once a branch clears baseline, expand it via planner tree
  tree_branching_factor: 2    # child branches created from above-baseline parents

strategies:
  enabled:
    - vectorize_loads
    - tma_prefetch
    - warp_reduction
    - fuse_passes
    - register_tiling
    - async_pipeline
    - fp4_lut
    - fast_math_expf
    - thread_coarsening
    - ldg_readonly
    - vectorized_stores
  disabled: []

profiler:
  tool: "hybrid"
  warmup_iters: 3
  profile_iters: 10

bottleneck:
  memory_bound_threshold_pct: 70
  compute_bound_threshold_pct: 60
  sync_bound_threshold_pct: 30
  latency_bound_threshold_pct: 40

cost_control:
  max_tokens_per_sub_call: 8192
  max_total_api_cost_usd: 25.0  # hard stop per kernel problem (Opus is ~5x Sonnet)
  max_total_cost_all_problems: 100.0

target:
  min_speedup: 1.5               # target speedup over baseline

rag:
  provider: "pinecone"
  top_k: 4
  namespace_env: "PINECONE_NAMESPACE"
  api_key_env: "PINECONE_API_KEY"
  index_name_env: "PINECONE_INDEX_NAME"
  index_host_env: "PINECONE_INDEX_HOST"
  text_field: "chunk_text"
  title_field: "title"
  source_field: "source"
  fields:
    - "chunk_text"
    - "title"
    - "source"

eval:
  correctness_atol: 1e-2
  correctness_rtol: 1e-3
  benchmark_warmup: 500
  benchmark_iters: 100
  # Shapes are now per-task (passed via problem_shape in run.py).
  # These are fallback defaults only — not used during normal WaferBench runs.
  problem_shapes:
    - [128, 2048]    # add_rmsnorm_fp4quant_b128xh2048
    - [128, 4096]    # add_rmsnorm_fp4quant_b128xh4096
    - [128, 8192]    # add_rmsnorm_fp4quant_b128xh8192

output:
  save_all_candidates: true
  save_profiler_reports: true
  output_dir: "outputs/"
  log_level: "INFO"
